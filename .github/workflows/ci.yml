name: CI

# Every push to main and every pull request into main, on GitHub-hosted runners only.
# Both jobs are the REQUIRED status checks on main (branch protection), so nothing
# merges unless they pass, and no merge waits for any particular machine to be on.
#
#   portable  GitHub-hosted Windows: builds everything (DLLs + test programs) with the
#             pinned WinLibs i686 toolchain and runs the tests that need nothing else
#             (ctest -L portable).
#   linux     GitHub-hosted Ubuntu: builds coduoplus_sv.so in the i386 build image.
#
# The tests that need the real game run locally, on a machine with the install
# (see docs/CI.md); there is no self-hosted runner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-msvcrt-r2/winlibs-i686-posix-dwarf-gcc-16.2.0-mingw-w64msvcrt-14.0.0-r2.zip

jobs:
  portable:
    name: portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the toolchain
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: C:\tools\mingw32
          key: winlibs-i686-16.2.0-r2

      - name: Install WinLibs i686 (gcc, cmake, ninja)
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\tools | Out-Null
          Invoke-WebRequest $env:WINLIBS_URL -OutFile $env:RUNNER_TEMP\winlibs.zip
          Expand-Archive $env:RUNNER_TEMP\winlibs.zip -DestinationPath C:\tools

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "C:\tools\mingw32\bin;$env:PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build
          if (-not (Test-Path build\mss32.dll)) { throw "build\mss32.dll missing" }

      - name: Portable tests
        shell: pwsh
        run: |
          $env:PATH = "C:\tools\mingw32\bin;$env:PATH"
          ctest --test-dir build -L portable --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: mss32-${{ github.sha }}
          path: |
            build/mss32.dll
            build/coduoplus.dll

  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the Dockerfile
        run: docker build --check -f server/linux/Dockerfile .
      - name: Build coduoplus_sv.so (artifact stage of server/linux/Dockerfile)
        run: docker build -f server/linux/Dockerfile --target artifact --output type=local,dest=build/linux .
      - name: Build the server image (default stage; not pushed)
        run: docker build -f server/linux/Dockerfile -t coduoplus-server:ci .
      - name: The image's entrypoint refuses to start without game files
        run: |
          out=$(docker run --rm coduoplus-server:ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "not found in /bins or /game"
      - uses: actions/upload-artifact@v4
        with:
          name: coduoplus_sv-${{ github.sha }}
          path: build/linux/coduoplus_sv.so
