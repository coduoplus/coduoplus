name: Release

# Push a tag vX.Y.Z (matching COD1RELOADED_VERSION in src/features/updater.h) and this
# builds, tests and publishes a GitHub release:
#
#   build     hosted Windows: mss32.dll + the no-rinput variant, portable tests
#   linux     hosted Ubuntu: coduoplus_sv.so for Linux servers
#   publish   only if both passed: player zip in the game folder layout, manifest.json
#             for the updater, release notes from CHANGELOG.md
#
# Hosted runners only: a release never waits for the self-hosted game machine. The
# tests against the real game (game.yml) are run by hand before tagging. The UI pk3
# is generated from the player's own pakuo03.pk3 (ui_pk3/build_pk3.py), so it can't
# be built here; attach it afterwards with `gh release upload` (see docs/CI.md).
#
# Also runnable by hand (Actions -> Release -> Run workflow) on an existing tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-msvcrt-r2/winlibs-i686-posix-dwarf-gcc-16.2.0-mingw-w64msvcrt-14.0.0-r2.zip
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Tag matches the compiled version
        shell: pwsh
        run: |
          $h = Get-Content src\features\updater.h -Raw
          if ($h -notmatch 'COD1RELOADED_VERSION\s*=\s*"([0-9.]+)"') { throw "version not found" }
          $v = $Matches[1]
          if ("v$v" -ne $env:TAG -and $v -ne $env:TAG) {
            throw "tag $env:TAG does not match COD1RELOADED_VERSION $v - bump updater.h first"
          }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Cache the toolchain
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: C:\tools\mingw32
          key: winlibs-i686-16.2.0-r2

      - name: Install WinLibs i686
        if: steps.cache-mingw.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\tools | Out-Null
          Invoke-WebRequest $env:WINLIBS_URL -OutFile $env:RUNNER_TEMP\winlibs.zip
          Expand-Archive $env:RUNNER_TEMP\winlibs.zip -DestinationPath C:\tools

      - name: Build (standard + no-rinput)
        shell: pwsh
        run: |
          $env:PATH = "C:\tools\mingw32\bin;$env:PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build
          cmake -S . -B build-norinput -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCOD1RELOADED_NO_RINPUT=ON
          cmake --build build-norinput --target mss32
          # the two must really differ: only the standard one carries the raw-input hook
          if (-not (Select-String -Path build\mss32.dll -Pattern "GetCursorPos IAT hook installed" -SimpleMatch -Quiet)) { throw "standard DLL lacks the rinput hook" }
          if (Select-String -Path build\norinput\mss32.dll -Pattern "GetCursorPos IAT hook installed" -SimpleMatch -Quiet) { throw "norinput DLL carries the rinput hook" }

      - name: Portable tests
        shell: pwsh
        run: |
          $env:PATH = "C:\tools\mingw32\bin;$env:PATH"
          ctest --test-dir build -L portable --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: dlls
          path: |
            build/mss32.dll
            build/norinput/mss32.dll

  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build coduoplus_sv.so
        run: |
          docker build -t coduoplus-linux server/linux
          docker run --rm -v "$PWD":/src coduoplus-linux sh server/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux/coduoplus_sv.so

  publish:
    name: publish
    needs: [build, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          set -e
          VERSION="${TAG#v}"
          mkdir -p dist/stage dist/norinput-stage
          cp artifacts/dlls/mss32.dll dist/mss32.dll
          cp artifacts/dlls/norinput/mss32.dll dist/mss32-norinput.dll
          cp artifacts/linux/coduoplus_sv.so dist/
          cp coduoplus.ini competitive.cfg.example dist/
          printf '{\n  "version": "%s",\n  "download_url": "https://github.com/%s/releases/latest/download/mss32.dll",\n  "notes": "CoDUO+ %s - see CHANGELOG"\n}\n' \
            "$VERSION" "$GITHUB_REPOSITORY" "$VERSION" > dist/manifest.json
          cat > dist/README.txt <<EOF
          CoDUO+ $VERSION - Call of Duty: United Offensive 1.51 client mod

          Install (game folder = the one with CoDUOMP.exe):
          1. Rename the game's mss32.dll to mss32_original.dll (the mod forwards all sound to it).
          2. Copy mss32.dll and coduoplus.ini next to CoDUOMP.exe.
          3. Optional, for a main-menu entry: copy uo\zz_coduoplus_ui.pk3 into the game's
             uo\ folder (a separate release download). Ctrl+M opens the settings either way.
          Server admins: competitive.cfg.example -> competitive.cfg next to the server's mss32.dll.
          Uninstall: delete those files, rename mss32_original.dll back to mss32.dll.
          EOF
          for s in stage norinput-stage; do
            cp dist/coduoplus.ini dist/competitive.cfg.example dist/README.txt dist/$s/
          done
          cp dist/mss32.dll dist/stage/mss32.dll
          cp dist/mss32-norinput.dll dist/norinput-stage/mss32.dll
          (cd dist/stage && zip -qr "../coduoplus-$VERSION.zip" .)
          (cd dist/norinput-stage && zip -qr "../coduoplus-$VERSION-norinput.zip" .)
          # release notes: this version's CHANGELOG section
          awk -v v="## v$VERSION" 'index($0, v) == 1 {p = 1; print; next} p && /^## v/ {exit} p && /^# / {exit} p' CHANGELOG.md > dist/notes.md
          ls -l dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "CoDUO+ $VERSION" --notes-file dist/notes.md --verify-tag
          fi
          gh release upload "$TAG" --clobber \
            dist/mss32.dll dist/mss32-norinput.dll dist/coduoplus.ini dist/competitive.cfg.example \
            dist/manifest.json dist/coduoplus_sv.so \
            "dist/coduoplus-$VERSION.zip" "dist/coduoplus-$VERSION-norinput.zip"
