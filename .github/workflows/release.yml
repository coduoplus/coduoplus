name: Release

# Builds mss32.dll and attaches the assets to the release automatically.
#  - fires when you PUBLISH a release on GitHub (uses the release's tag), or
#  - run it by hand (Actions tab -> Release -> Run workflow) on an existing tag.
#
# Uses the stable Ubuntu i686-w64-mingw32 cross-compiler (the rolling msys2
# toolchain on windows runners ships a bleeding-edge gcc that fails to
# static-link, so cross-compile here).
#
# CoD:UO port: the UI pk3 (zz_coduoplus_ui.pk3) is NOT built here. It is
# generated from the player's own uo/pakuo03.pk3 (ui_pk3/build_pk3.py) so no
# Activision file lives in the repo, and a CI runner has no game install.
# release.ps1 builds it locally and can upload it to the same release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build + attach assets to (e.g. 0.1.0)"
        required: true

permissions:
  contents: write   # required for release upload with GITHUB_TOKEN

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && TAG="${{ github.event.inputs.tag }}"
          TAG="${TAG#v}"   # strip a leading 'v' if present
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Building CoDUO+ $TAG"

      - name: Install 32-bit MinGW (stable) + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686 cmake zip
          # match the local toolchain's POSIX threading model
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix || true
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix || true

      - name: Build mss32.dll
        run: |
          # keep the compiled version in sync with the release tag
          sed -i "s/COD1RELOADED_VERSION = \"[^\"]*\"/COD1RELOADED_VERSION = \"$TAG\"/" src/features/updater.h
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=i686-w64-mingw32-windres
          cmake --build build --target mss32 -j
          test -f build/mss32.dll

      - name: Build mss32.dll (no-rinput variant)
        run: |
          # Same DLL without the raw-input GetCursorPos hook, for bisecting input
          # problems. Separate output DIRECTORY (the file has to be called mss32.dll) -
          # see the COD1RELOADED_OUTPUT_DIR block in CMakeLists.txt.
          cmake -S . -B build-norinput \
            -DCOD1RELOADED_NO_RINPUT=ON \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=i686-w64-mingw32-windres
          cmake --build build-norinput --target mss32 -j
          test -f build/norinput/mss32.dll
          # Prove the two really differ before packaging: the standard one must
          # carry the hook string, the other must not.
          grep -q "GetCursorPos IAT hook installed" build/mss32.dll
          ! grep -q "GetCursorPos IAT hook installed" build/norinput/mss32.dll

      - name: Package assets
        run: |
          mkdir -p dist
          cp build/mss32.dll coduoplus.ini dist/
          printf '{\n  "version": "%s",\n  "download_url": "https://github.com/%s/releases/latest/download/mss32.dll",\n  "notes": "CoDUO+ %s - see CHANGELOG"\n}\n' \
            "$TAG" "$GITHUB_REPOSITORY" "$TAG" > dist/manifest.json
          (cd dist && zip -q "coduoplus-$TAG.zip" mss32.dll coduoplus.ini)
          cp build/norinput/mss32.dll dist/mss32-norinput.dll
          mkdir -p dist/norinput && cp build/norinput/mss32.dll dist/norinput/mss32.dll
          (cd dist/norinput && cp ../coduoplus.ini . && zip -q "../coduoplus-$TAG-norinput.zip" mss32.dll coduoplus.ini)
          ls -l dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            dist/mss32.dll \
            dist/coduoplus.ini \
            dist/manifest.json \
            "dist/coduoplus-$TAG.zip" \
            dist/mss32-norinput.dll \
            "dist/coduoplus-$TAG-norinput.zip" \
            --clobber
