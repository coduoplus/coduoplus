; ======================================================================
;  CoDUO+  -  configuration  (CoD:UO 1.51 port of COD1.6X 1.6.6)
;  Place this file next to mss32.dll in your Call of Duty folder (the one
;  with CoDUOMP.exe). docs/CONFIGURATION.md explains every key.
;
;  Defaults are chosen to look EXACTLY like vanilla UO: the mod does not
;  touch your resolution, your fullscreen mode or your FOV unless you ask.
;  Gameplay/netcode are locked inside the client for fair competitive play.
;  Booleans accept  on / off.
; ======================================================================

; ----- DISPLAY --------------------------------------------------------
;  fullscreen = on  keeps the game's own fullscreen (your resolution, and
;                   4:3 stretching by your GPU, exactly like vanilla).
;             = off runs in a window; combine with window_borderless.
;
;  window_borderless = on  gives a borderless window (instant alt-tab).
;
;  !! CUSTOM / STRETCHED RESOLUTIONS: a window can only show a resolution
;     your DESKTOP is already in. Only exclusive fullscreen switches the
;     display mode. So with fullscreen = off + window_borderless = on:
;       - a resolution BIGGER than your desktop (e.g. 2128x1330 on a 1080p
;         screen) cannot work at all -> the mod detects this and turns
;         fullscreen back on by itself for that launch;
;       - a resolution SMALLER than your desktop (e.g. 1440x1080) runs, but
;         your GPU does NOT stretch it: black bars, thinner models.
;     If you play a stretched 4:3 res, use  fullscreen = on  and
;     window_borderless = off. Both cases are written to coduoplus.log.
;
;  max_hz_native_res = on  with refresh_rate = max: a custom resolution the
;     driver only lists at a lower Hz (1440x1080 @ 180 on a 320 Hz panel) is
;     swapped for the resolution that has the maximum, and a 4:3 stretch is
;     then done by the mod (view_mode = stretched). off = keep your custom res.
;
;  view_mode = classic     vanilla FOV (recommended, and what you had)
;            = widescreen  Hor+ correction on wide screens
;            = stretched   4:3 FOV forced (experimental - looks unusual)
;
;  fov_unlock = on lets the in-game FOV slider go above 80 (up to 95, the competitive maximum).
;  refresh_rate = max runs the display at the highest Hz it lists.
;
;  IMPOSED BY THE MOD (upstream COD1.6X 1.6.9's ini lock - everybody plays with the
;  same frame pacing, input path and presentation): fullscreen, refresh_rate,
;  frame_limiter_enable, force_1ms_timer, gpu_sync, input_late_sampling and
;  smoothness_cpu_cores are rewritten to their values at every launch, and
;  r_fullscreen is kept at 1 (read-only). Editing them here changes nothing.
; ----------------------------------------------------------------------
[coduoplus]

fullscreen               = on
window_borderless        = on   ; no effect while fullscreen is imposed
view_mode                = classic
aspect_ratio             = auto
fov_unlock               = off
refresh_rate             = max

; ----- MOUSE ----------------------------------------------------------
;  raw_mouse_input = on reads the mouse straight from the device instead of
;  through the Windows cursor: no pointer acceleration, no desktop mouse-speed
;  slider, no 1-pixel rounding. Your in-game sensitivity is unchanged, the aim
;  just stops depending on Windows settings.
;
;  This is only the DEFAULT. The setting lives in the cvar `m_rinput` (0/1) and
;  is saved in your config, so you can also toggle it in the console at any time.
;  `m_rinput_hz` MEASURES your mouse's polling rate - it is a readout, not a setting:
;  writing to it does nothing, the mod overwrites it. A mouse only reports while it
;  MOVES, so the figure only means something during a swipe; `m_rinput_hz_max` keeps
;  the best reading and is the one that answers "is my mouse really at 1000 Hz?".
; ----------------------------------------------------------------------
raw_mouse_input          = off

; ----- IN-GAME MENU ---------------------------------------------------
;  The 1.6X settings menu is opened from the MAIN MENU. There is no in-game
;  hotkey: a global key poll fires while you aim, shoot or type, so it was
;  removed.
; ----------------------------------------------------------------------
menu_enable              = on

; ----- WINDOW  (only used when window_borderless = on) ----------------
window_follow_current_monitor = on
window_minimize_on_focus_loss = on
window_monitor           = -1

; ----- PERFORMANCE  (anti-stutter; leave on) --------------------------
smoothness_process_priority      = high
smoothness_main_thread_priority  = highest
smoothness_disable_power_throttling = on
smoothness_lock_working_set      = on
smoothness_disable_fso           = on
force_1ms_timer                  = on
frame_limiter_enable             = on
;  gpu_sync = auto waits for the GPU to finish presenting each frame before the next
;  one starts (one frame in flight, never two): the frame that carries your mouse
;  movement is on screen before the next movement is read. Costs nothing while the
;  GPU keeps up with the fps cap; if the GPU sets the fps instead, the sync switches
;  itself off for the session (both written to coduoplus.log). on = never switch off,
;  off = never sync.
gpu_sync                         = auto
;  input_late_sampling = on reads the mouse again right after the frame limiter's
;  wait instead of only before it: movement made during the wait reaches the frame
;  being built instead of the next one (one frame less latency than vanilla).
;  off = the engine's own order. Needs frame_limiter_enable.
input_late_sampling              = on

; ----- DISCORD  (optional) --------------------------------------------
discord_rpc_enable       = on

; ----- ADVANCED  (rarely needed) --------------------------------------
updater_enable                   = on
updater_auto_download            = on
updater_show_dialog              = on
; CoDUO+ has no release feed yet: leave empty (updater idle). NEVER point this at
; cod1plus/client - that feed ships the CoD1 build, which does not run on UO.
updater_manifest_url             =
; "INSTALL / UPDATE PAM" button (Files tab): the competitive mod's pk3s, fetched from
; the manifest below without joining a server. off = button hidden.
; CoD:UO: off - the upstream manifest is CoD1's rPAM. Set a UO manifest to use it.
pam_download_enable              = off
pam_manifest_url                 =
smoothness_cpu_cores             = 0
smoothness_cpu_first_core        = 0
smoothness_working_set_min_mb    = 128
smoothness_working_set_max_mb    = 5000
frame_limiter_bias_us            = 0
demo_upload_enable               = off
avatar_overlay_enable            = off

; ---- hosting (only used when this game runs a server) ------------------------
; Lag compensation: a shot hits where the target was on the SHOOTER's screen, not
; where the target has moved on to since. These are the defaults of the server
; cvars g_antilag (0 off, 1 on, 2 on + log every rewind) and g_antilagMaxMs (the
; furthest back a shot is compensated); +set or rcon change them live.
antilag                          = on
antilag_max_ms                   = 300
; on = also rewind the target's pose (stance, lean, aim) to that moment; off =
; position and facing only. Default of the server cvar g_antilagPose.
antilag_pose                     = on
